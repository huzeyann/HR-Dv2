[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hires_dino"
version = "0.0.1"
authors = [
  { name="Anonymous", email="hello@gmail.com"},
]
description = "Module for extracting high-resolution features from the DINO model. Forked from https://github.com/tldr-group/HR-Dv2"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["hires_dino"]
